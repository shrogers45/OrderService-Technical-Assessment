# ============================================================
# OrderService CI/CD Pipeline
# ============================================================
# This workflow validates, secures, publishes, and deploys the
# OrderService application through a series of dependent stages.
#
# Normal push pipeline:
#
#   Format Check
#        |
#        v
#   Build and Test
#        |
#        v
#   Dependency Scan
#        |
#        v
#   Docker Build, Trivy Scan, and GHCR Push
#        |
#        v
#   Deploy (main branch only)
#
# Manual redeploy pipeline:
#
#   workflow_dispatch
#        |
#        v
#   Existing GHCR image tag
#        |
#        v
#   Deploy only
#
# Gating vs. reporting:
#   Format Check      = GATE
#   Build and Test    = GATE
#   Dependency Scan   = REPORT
#   Trivy Image Scan  = GATE
#   GHCR Push         = main branch only
#   Deploy            = main branch only or manual redeploy
#
# Performance optimization:
#   NuGet packages are cached using actions/cache@v4.
#   The cache key is based on the operating system and the
#   project file hash so unchanged dependencies can be reused.
# ============================================================

name: OrderService CI/CD


# ============================================================
# Global Environment Variables
# ============================================================
# IMAGE_NAME defines the GitHub Container Registry location
# used for container image publishing and deployment.
#
# Normal pipeline images use the Git commit SHA as the tag.
# Manual redeployment accepts an existing GHCR image tag.
# ============================================================

env:
  IMAGE_NAME: ghcr.io/shrogers45/orderservice


# ============================================================
# Workflow Triggers
# ============================================================
# The workflow supports three execution paths:
#
# 1. Push to main:
#      Runs the complete CI/CD pipeline and deploys.
#
# 2. Pull request to main:
#      Runs validation and security scanning but does not
#      publish or deploy.
#
# 3. workflow_dispatch:
#      Allows an existing GHCR image to be redeployed manually
#      without rebuilding, testing, scanning, or republishing it.
#
# For manual redeployment, image_tag should contain an existing
# Git SHA/image tag previously published to GHCR.
# ============================================================

"on":
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing GHCR image tag (Git SHA) to redeploy"
        required: true
        type: string


# ============================================================
# Workflow Permissions
# ============================================================
# contents: read
#   Allows repository checkout.
#
# packages: write
#   Allows the normal main pipeline to publish images to GHCR.
#   The same GITHUB_TOKEN can also authenticate for image pulls
#   during deployment.
# ============================================================

permissions:
  contents: read
  packages: write


# ============================================================
# CI/CD Jobs
# ============================================================

jobs:

  # ----------------------------------------------------------
  # Job 1: Format Check
  # ----------------------------------------------------------
  # Purpose:
  # Enforce consistent C# formatting based on .editorconfig.
  #
  # This job does not run during workflow_dispatch because a
  # manual workflow dispatch is reserved for redeployment only.
  #
  # --verify-no-changes causes the job to fail rather than
  # automatically modifying improperly formatted source files.
  #
  # This acts as the first quality gate. If it fails,
  # downstream CI jobs will not execute.
  # ----------------------------------------------------------

  format:
    name: Format Check
    runs-on: ubuntu-latest

    if: github.event_name != 'workflow_dispatch'

    steps:

      # Download the repository source code onto the runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the .NET 8 SDK required to validate the project.
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Cache downloaded NuGet packages.
      #
      # The primary key changes when a .csproj file changes.
      # restore-keys allows GitHub Actions to reuse the closest
      # compatible NuGet cache when an exact match is unavailable.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Restore the project's NuGet dependencies.
      - name: Restore application and test dependencies
        run: dotnet restore tests/OrderService.Tests/OrderService.Tests.csproj

      # Verify formatting against the repository's formatting rules.
      # The pipeline fails if source files require formatting changes.
      - name: Check code formatting
        run: dotnet format --verify-no-changes --no-restore


  # ----------------------------------------------------------
  # Job 2: Build and Test
  # ----------------------------------------------------------
  # Purpose:
  # Verify that the application successfully compiles in Release
  # configuration and execute the project's test step.
  #
  # "needs: format" creates an explicit dependency.
  #
  # If Format Check fails or is skipped during manual redeploy,
  # this job will not execute.
  # ----------------------------------------------------------

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: format

    steps:

      # Each GitHub-hosted job starts on a fresh runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the required .NET 8 SDK.
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Restore the NuGet package cache from previous workflow runs.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Restore NuGet packages before compiling.
      - name: Restore dependencies
        run: dotnet restore

      # Compile the application using Release configuration.
      - name: Build application
        run: dotnet build --configuration Release --no-restore

      # Execute the real xUnit integration tests against the ASP.NET Core application.
      # The test project validates /health and the default /version behavior.
      - name: Run integration tests
        run: dotnet test tests/OrderService.Tests/OrderService.Tests.csproj --configuration Release --no-restore


  # ----------------------------------------------------------
  # Job 3: Dependency Scan
  # ----------------------------------------------------------
  # Purpose:
  # Report known vulnerabilities in direct and transitive NuGet
  # package dependencies.
  #
  # This stage provides dependency vulnerability visibility.
  #
  # The Trivy container image scan later in the workflow is the
  # blocking HIGH/CRITICAL security gate.
  #
  # "needs: build" means this job executes only after Build and
  # Test completes successfully.
  # ----------------------------------------------------------

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    needs: build

    steps:

      # Checkout the source code on this runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install .NET 8 for dependency inspection.
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Reuse cached NuGet packages when possible.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Restore dependencies so the complete dependency graph exists.
      - name: Restore dependencies
        run: dotnet restore

      # Report known vulnerabilities in direct and transitive packages.
      - name: Scan NuGet dependencies for vulnerabilities
        run: dotnet list package --vulnerable --include-transitive


  # ----------------------------------------------------------
  # Job 4: Docker Build, Trivy Scan, and GHCR Push
  # ----------------------------------------------------------
  # Purpose:
  # Build the production Docker image, scan the exact image with
  # Trivy, and publish it to GHCR after the security gate passes.
  #
  # The image is tagged using the Git commit SHA.
  #
  # Trivy:
  #   - Scans container vulnerabilities.
  #   - Evaluates HIGH and CRITICAL findings.
  #   - Ignores vulnerabilities without an available fix.
  #   - Returns exit code 1 when qualifying vulnerabilities remain.
  #
  # Because Build/Test and Dependency Scan are upstream through
  # "needs:", this job cannot run when those stages fail.
  #
  # GHCR authentication and publishing occur only for direct
  # pushes to main.
  #
  # Pull requests build and scan the image but cannot publish it.
  #
  # During workflow_dispatch this entire job is skipped because
  # its upstream dependency chain was skipped.
  # ----------------------------------------------------------

  container-security:
    name: Docker Build, Trivy Scan, and GHCR Push
    runs-on: ubuntu-latest
    needs: dependency-scan

    steps:

      # Checkout Dockerfile and application source.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build the exact production image that will be scanned.
      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      # HIGH/CRITICAL vulnerabilities with available fixes cause
      # this step and therefore the job to fail.
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          scanners: "vuln"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

      # Authenticate to GHCR only during direct pushes to main.
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish the exact SHA-tagged image that passed Trivy.
      - name: Push Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}


  # ----------------------------------------------------------
  # Job 5: Deploy
  # ----------------------------------------------------------
  # Purpose:
  # Deploy an existing image from GHCR.
  #
  # There are two valid paths into this job:
  #
  # 1. Normal main push
  #      container-security must complete successfully.
  #      The current Git SHA is deployed.
  #
  # 2. workflow_dispatch
  #      CI jobs are skipped.
  #      The image tag entered by the user is deployed directly.
  #
  # "always()" is required because workflow_dispatch intentionally
  # causes the upstream CI chain to be skipped. Without always(),
  # GitHub Actions would automatically skip this job because its
  # "needs" dependency was skipped.
  #
  # For normal pushes, needs.container-security.result must be
  # "success", preserving the security gate before deployment.
  #
  # Pull requests never satisfy this job condition and therefore
  # cannot deploy.
  # ----------------------------------------------------------

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: container-security

    if: |
      always() &&
      (
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.container-security.result == 'success'
        ) ||
        github.event_name == 'workflow_dispatch'
      )

    steps:

      # Determine which image tag should be deployed.
      #
      # Normal push:
      #   DEPLOY_TAG = current Git commit SHA
      #
      # Manual workflow_dispatch:
      #   DEPLOY_TAG = image_tag entered from the Actions UI
      - name: Resolve deployment image tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "DEPLOY_TAG=${{ inputs.image_tag }}" >> "$GITHUB_ENV"
            echo "Manual redeployment requested for image tag: ${{ inputs.image_tag }}"
          else
            echo "DEPLOY_TAG=${{ github.sha }}" >> "$GITHUB_ENV"
            echo "Automatic deployment requested for image tag: ${{ github.sha }}"
          fi

      # Authenticate so the runner can pull the existing image.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull the image selected by the deployment path.
      #
      # A workflow_dispatch redeployment intentionally does not
      # rebuild the image. It must already exist in GHCR.
      - name: Pull Docker image
        run: docker pull "${{ env.IMAGE_NAME }}:${DEPLOY_TAG}"

      # Stop and remove a same-name container if one exists.
      #
      # "|| true" allows first deployment to continue when there
      # is no existing container.
      - name: Remove existing container
        run: docker rm -f orderservice || true

      # Run the selected image in detached mode.
      #
      # APP_VERSION is set to DEPLOY_TAG so /version identifies
      # exactly which image is currently running.
      - name: Start container
        run: |
          docker run -d \
            --name orderservice \
            -p 8080:8080 \
            -e APP_VERSION="${DEPLOY_TAG}" \
            "${{ env.IMAGE_NAME }}:${DEPLOY_TAG}"

      # Allow the service time to initialize and verify /health.
      - name: Verify health endpoint
        run: |
          sleep 10
          curl --fail --silent --show-error http://localhost:8080/health

      # Verify /version reports the same image tag that was selected
      # for deployment.
      #
      # grep returns a non-zero exit code when the expected tag is
      # absent, causing deployment validation to fail.
      - name: Verify deployed version
        run: |
          echo "Expected deployed version: ${DEPLOY_TAG}"
          VERSION_RESPONSE=$(curl --fail --silent --show-error http://localhost:8080/version)
          echo "Application response: ${VERSION_RESPONSE}"
          echo "${VERSION_RESPONSE}" | grep "${DEPLOY_TAG}"

      # Show deployment evidence in the Actions log.
      - name: Show deployed container
        run: docker ps --filter "name=orderservice"