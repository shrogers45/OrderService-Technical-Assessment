# ============================================================
# OrderService CI/CD Pipeline
# ============================================================
# This workflow validates, secures, publishes, and deploys the
# OrderService application through a series of dependent stages.
#
# Current pipeline:
#   Format Check
#        |
#        v
#   Build and Test
#        |
#        v
#   Dependency Scan
#        |
#        v
#   Docker Build, Trivy Scan, and GHCR Push
#        |
#        v
#   Deploy (main branch only)
#
# Gating vs. reporting:
#   Format Check      = GATE
#   Build and Test    = GATE
#   Dependency Scan   = REPORT
#   Trivy Image Scan  = GATE
#   GHCR Push         = main branch only
#   Deploy            = main branch only
# ============================================================

name: OrderService CI/CD


# ============================================================
# Global Environment Variables
# ============================================================
# IMAGE_NAME defines the GitHub Container Registry location
# used for container image publishing and deployment.
#
# The Git commit SHA is used as the image tag so each published
# and deployed image can be traced back to its source revision.
# ============================================================

env:
  IMAGE_NAME: ghcr.io/shrogers45/orderservice


# ============================================================
# Workflow Triggers
# ============================================================
# The pipeline runs when:
#
# 1. Code is pushed to the main branch.
# 2. A pull request targets the main branch.
# 3. A user manually starts the workflow using workflow_dispatch.
#
# workflow_dispatch will be enhanced to support the assessment's
# redeploy-only requirement after the normal deployment path
# has been validated.
# ============================================================

"on":
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:


# ============================================================
# Workflow Permissions
# ============================================================
# contents: read
#   Allows the workflow to read/checkout repository contents.
#
# packages: write
#   Allows the workflow to authenticate to GitHub Container
#   Registry and publish/pull container images.
# ============================================================

permissions:
  contents: read
  packages: write


# ============================================================
# CI/CD Jobs
# ============================================================

jobs:

  # ----------------------------------------------------------
  # Job 1: Format Check
  # ----------------------------------------------------------
  # Purpose:
  # Enforce consistent C# formatting based on .editorconfig.
  #
  # --verify-no-changes causes the job to fail rather than
  # automatically modifying improperly formatted source files.
  #
  # This acts as the first quality gate. If it fails,
  # downstream jobs will not execute.
  # ----------------------------------------------------------

  format:
    name: Format Check
    runs-on: ubuntu-latest

    steps:

      # Download the repository source code onto the runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the .NET 8 SDK required to validate the project.
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Restore the project's NuGet dependencies.
      - name: Restore dependencies
        run: dotnet restore

      # Verify formatting against the repository's formatting rules.
      # The pipeline fails if source files require formatting changes.
      - name: Check code formatting
        run: dotnet format --verify-no-changes --no-restore


  # ----------------------------------------------------------
  # Job 2: Build and Test
  # ----------------------------------------------------------
  # Purpose:
  # Verify that the application can successfully compile in
  # Release configuration and execute the project's test step.
  #
  # "needs: format" establishes an explicit dependency.
  # Therefore this job will not execute if Format Check fails.
  # ----------------------------------------------------------

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: format

    steps:

      # Each GitHub-hosted job starts on a fresh runner,
      # so the repository must be checked out again.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the required .NET 8 SDK.
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Restore NuGet packages before compiling the application.
      - name: Restore dependencies
        run: dotnet restore

      # Compile the application using Release configuration.
      # --no-restore avoids performing a second package restore.
      - name: Build application
        run: dotnet build --configuration Release --no-restore

      # Execute the project's test step against the Release build.
      # --no-build prevents rebuilding code that was already compiled.
      - name: Run tests
        run: dotnet test --configuration Release --no-build


  # ----------------------------------------------------------
  # Job 3: Dependency Scan
  # ----------------------------------------------------------
  # Purpose:
  # Inspect direct and transitive NuGet dependencies for known
  # security vulnerabilities.
  #
  # This provides visibility into vulnerable application
  # dependencies before a container image is created.
  #
  # "needs: build" ensures dependency analysis only occurs
  # after the application successfully builds and tests.
  #
  # This stage is primarily used for dependency visibility.
  # The Trivy image scan in the next job acts as the blocking
  # HIGH/CRITICAL container security gate.
  # ----------------------------------------------------------

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    needs: build

    steps:

      # Checkout the source code on the dependency scan runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install .NET 8 so NuGet dependency information can be evaluated.
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Restore dependencies so the complete dependency graph is available.
      - name: Restore dependencies
        run: dotnet restore

      # Report known vulnerabilities in both direct and
      # transitive NuGet package dependencies.
      - name: Scan NuGet dependencies for vulnerabilities
        run: dotnet list package --vulnerable --include-transitive


  # ----------------------------------------------------------
  # Job 4: Docker Build, Trivy Scan, and GHCR Push
  # ----------------------------------------------------------
  # Purpose:
  # Build the production Docker image, scan the exact image with
  # Trivy, and publish it to GitHub Container Registry only after
  # the security gate succeeds.
  #
  # The image is tagged with the Git commit SHA so each image
  # can be traced directly to the source revision that created it.
  #
  # Trivy is configured to:
  #   - Scan container vulnerabilities.
  #   - Evaluate HIGH and CRITICAL severity findings.
  #   - Ignore findings that do not currently have an available fix.
  #   - Return exit code 1 when qualifying vulnerabilities remain.
  #
  # Because the scan returns a non-zero exit code on failure,
  # publishing cannot occur unless the image passes the gate.
  #
  # GHCR login and push steps execute only for direct pushes
  # to the main branch. Pull requests are built and scanned
  # but cannot publish container images.
  #
  # The build, scan, and push occur within the same job so the
  # exact image that passed Trivy is the image that is published.
  #
  # "needs: dependency-scan" ensures this stage only begins after
  # formatting, build/test, and dependency scanning succeed.
  # ----------------------------------------------------------

  container-security:
    name: Docker Build, Trivy Scan, and GHCR Push
    runs-on: ubuntu-latest
    needs: dependency-scan

    steps:

      # Checkout the repository so the Dockerfile and application
      # source are available on the GitHub-hosted runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build the production container image.
      #
      # The image uses the GHCR repository name and is tagged
      # with the Git commit SHA for traceability.
      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      # Scan the exact Docker image produced in the previous step.
      #
      # exit-code: "1"
      #   Fails the GitHub Actions job when qualifying
      #   vulnerabilities are detected.
      #
      # severity: "HIGH,CRITICAL"
      #   Limits the blocking security gate to HIGH and CRITICAL
      #   vulnerability findings.
      #
      # ignore-unfixed: true
      #   Ignores vulnerabilities that currently have no
      #   upstream fix available.
      #
      # scanners: "vuln"
      #   Limits this step to vulnerability scanning.
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          scanners: "vuln"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

      # Authenticate to GitHub Container Registry using the
      # automatically generated GitHub Actions GITHUB_TOKEN.
      #
      # Authentication occurs only for direct pushes to main.
      # Pull request workflows do not receive publishing access.
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish the exact SHA-tagged image that successfully
      # passed the Trivy security gate.
      #
      # This step is restricted to direct pushes to main.
      - name: Push Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}


  # ----------------------------------------------------------
  # Job 5: Deploy
  # ----------------------------------------------------------
  # Purpose:
  # Pull and run the exact SHA-tagged image that was published
  # to GHCR by the previous job.
  #
  # This assessment deployment runs on the GitHub-hosted Actions
  # runner. The runner is temporary, so this demonstrates and
  # validates the deployment procedure rather than providing a
  # persistent production hosting environment.
  #
  # Deployment performs the following:
  #   - Authenticate to GHCR.
  #   - Pull the published SHA-tagged image.
  #   - Stop/remove a same-name container if one exists.
  #   - Run the new container in detached mode.
  #   - Map host port 8080 to container port 8080.
  #   - Set APP_VERSION to the deployed image tag.
  #   - Verify /health.
  #   - Verify /version reports the deployed image tag.
  #
  # "needs: container-security" ensures deployment cannot occur
  # unless the container security/publishing job succeeds.
  #
  # The job-level condition restricts automatic deployment to
  # direct pushes to the main branch.
  # ----------------------------------------------------------

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: container-security

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # Authenticate to GHCR so the deployment runner can pull
      # the image published by the previous job.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull the exact SHA-tagged image that passed the Trivy
      # security gate and was published to GHCR.
      - name: Pull Docker image
        run: docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Stop and remove a same-name container if one exists.
      #
      # "|| true" prevents the deployment from failing when this
      # is the first deployment and no previous container exists.
      - name: Remove existing container
        run: docker rm -f orderservice || true

      # Start the newly published container in detached mode.
      #
      # APP_VERSION is set to the image tag (Git commit SHA).
      # This provides runtime verification of the deployed version.
      - name: Start container
        run: |
          docker run -d \
            --name orderservice \
            -p 8080:8080 \
            -e APP_VERSION=${{ github.sha }} \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Allow the application to initialize and verify that the
      # health endpoint responds successfully.
      - name: Verify health endpoint
        run: |
          sleep 10
          curl --fail --silent --show-error http://localhost:8080/health

      # Call /version and verify that the application reports the
      # exact Git SHA used as the deployed container image tag.
      #
      # grep returns a non-zero exit code if the expected SHA is
      # not present, causing the deployment validation to fail.
      - name: Verify deployed version
        run: |
          echo "Expected deployed version: ${{ github.sha }}"
          VERSION_RESPONSE=$(curl --fail --silent --show-error http://localhost:8080/version)
          echo "Application response: $VERSION_RESPONSE"
          echo "$VERSION_RESPONSE" | grep "${{ github.sha }}"

      # Display the running container for deployment evidence
      # in the GitHub Actions log.
      - name: Show deployed container
        run: docker ps --filter "name=orderservice"